<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kimi Proxy Console</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Kimi API Gateway</p>
          <h1>Proxy console for Roo Code, OpenClowe and MCP</h1>
          <p class="lead">Test the OpenAI-compatible endpoint before connecting clients. Secrets are entered only locally in the browser and are never stored on the server.</p>
        </div>
        <div class="status-card">
          <span class="status-dot"></span>
          <div>
            <strong id="healthText">Checking the server...</strong>
            <small id="modelText">model: unknown</small>
          </div>
        </div>
      </section>

      <section class="panel">
        <form id="chatForm" class="composer">
          <label>
            Proxy API key
            <input id="proxyKey" type="password" placeholder="Bearer key from .env">
          </label>
          <label>
            Message
            <textarea id="prompt" rows="7" placeholder="For example: explain how to connect this endpoint in Roo Code"></textarea>
          </label>
          <button type="submit">Send request</button>
        </form>

        <article class="response">
          <div class="response-header">
            <span>Kimi response</span>
            <button id="copyButton" type="button">Copy</button>
          </div>
          <pre id="output">Ready for a request.</pre>
        </article>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
